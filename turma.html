<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Turma — Direção de Turma</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/styles.css?v=1.1.3" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/core/config.js"></script>
    <script src="js/core/session.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/permissions.js"></script>
    <script src="js/utils/dates.js"></script>
    <script src="js/services/turmas.service.js"></script>
    <script src="js/services/alunos.service.js"></script>
    <script src="js/services/documentos.service.js"></script>
  </head>
  <body class="dt-workspace dt-class-body">
    <header class="app-header">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="Direção de Turma" class="brand-logo" />
        <div class="brand-text">
          <h1>DIREÇÃO DE TURMA</h1>
          <div class="tag">Comunidade CSJ Ramalhão</div>
        </div>
      </a>
      <nav class="nav-menu">
        <a href="index.html">Painel DT</a>
        <button id="signOutBtn">Sair</button>
      </nav>
    </header>

    <main class="app-container dt-class-page">
      <div id="loadingMsg" style="color: var(--text-muted); font-size: 14px">A carregar turma...</div>
      <div id="turmaContent" style="display: none">
        <div class="dt-page-heading dt-class-heading">
          <div>
            <a href="index.html" class="dt-breadcrumb">Painel DT <span aria-hidden="true">/</span> A minha turma</a>
            <div class="dt-eyebrow">Visão geral da turma</div>
            <h2 id="turmaTitulo"></h2>
            <p id="turmaSubtitulo"></p>
          </div>
          <div class="dt-class-heading-side">
            <span class="dt-class-heading-mark" aria-hidden="true">DT</span>
            <span><small>Ano letivo</small><strong id="classSchoolYear">—</strong></span>
          </div>
        </div>

        <nav class="dt-section-nav" aria-label="Secções da turma">
          <a href="#alunos">Alunos</a>
          <a href="#documentos">Documentos</a>
        </nav>

        <section class="dt-section dt-class-roster" id="alunos">
          <div class="dt-section-heading">
            <div>
              <div class="dt-eyebrow">Turma</div>
              <h2>Alunos</h2>
            </div>
            <span id="alunosCount" class="dt-count-label"></span>
          </div>

          <div class="dt-roster-toolbar">
            <label class="search-wrapper" for="searchAluno">
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input type="search" id="searchAluno" class="search-input" placeholder="Pesquisar por nome ou número" />
            </label>
          </div>

          <div id="alunosList" class="dt-student-list">
            <div class="dt-empty-state">A carregar alunos...</div>
          </div>
        </section>

        <section class="dt-section dt-class-documents" id="documentos">
          <div class="dt-section-heading">
            <div>
              <div class="dt-eyebrow">Arquivo partilhado</div>
              <h2>Documentos da turma</h2>
            </div>
            <button id="toggleDocFormBtn" class="btn btn-secondary">+ Adicionar documento</button>
          </div>

          <div id="docForm" style="display: none; margin-bottom: 16px">
            <div class="form-row">
              <div class="form-group">
                <label for="docTitulo">Título</label>
                <input type="text" id="docTitulo" class="form-control" placeholder="Ex: Ata do Conselho de Turma" />
              </div>
              <div class="form-group">
                <label for="docCategoria">Categoria</label>
                <input type="text" id="docCategoria" class="form-control" placeholder="Ex: Ata" />
              </div>
            </div>
            <div class="form-group">
              <label for="docFicheiro">Ficheiro</label>
              <input type="file" id="docFicheiro" class="form-control" />
            </div>
            <div style="display: flex; gap: 8px; margin-top: 8px">
              <button id="guardarDocBtn" class="btn btn-primary">Carregar</button>
              <button id="cancelarDocBtn" class="btn btn-secondary">Cancelar</button>
            </div>
            <div id="docMsg"></div>
          </div>

          <div id="docsList" class="dt-document-list"></div>
        </section>
      </div>
    </main>

    <footer style="padding: 14px 0; text-align: center; color: var(--text-muted); font-size: 12px">
      made by antonio.appleton | Departamento de Programação · v1.1.3
    </footer>

    <script>
      (async () => {
        const session = await requireSession("login.html");
        if (!session) return;

        document.getElementById("signOutBtn")?.addEventListener("click", signOut);

        const turmaId = new URLSearchParams(location.search).get("id");
        const loadingEl = document.getElementById("loadingMsg");
        if (!turmaId) {
          loadingEl.textContent = "Turma não indicada.";
          return;
        }

        const professor = await getCurrentProfessor();

        try {
          const turma = await TurmasService.getById(turmaId);
          if (!turma || !canAccessTurma(professor, turma)) {
            loadingEl.textContent = "Não tens acesso a esta turma.";
            return;
          }

          document.getElementById("turmaTitulo").textContent = `${turma.nome} (${turma.ano}º ano)`;
          document.getElementById("turmaSubtitulo").textContent = turma.ciclos?.nome || "";
          const anoAtual = new Date().getFullYear();
          const inicioAnoLetivo = new Date().getMonth() >= 8 ? anoAtual : anoAtual - 1;
          document.getElementById("classSchoolYear").textContent = `${inicioAnoLetivo}/${inicioAnoLetivo + 1}`;

          const alunos = await AlunosService.getByTurma(turmaId);
          const listEl = document.getElementById("alunosList");
          document.getElementById("alunosCount").textContent = `${alunos.length} aluno${alunos.length === 1 ? "" : "s"}`;

          function renderAlunos(items) {
            if (!items.length) {
              listEl.innerHTML = '<div class="admin-list-item" style="color: var(--text-muted)">Nenhum aluno encontrado.</div>';
              return;
            }
            listEl.innerHTML = items
              .map(
                (a) => {
                  const iniciais = (a.nome || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((parte) => parte[0]).join("").toUpperCase();
                  return `
                <a href="aluno.html?id=${a.id}" class="dt-student-row">
                  <span class="dt-student-avatar" aria-hidden="true">${iniciais}</span>
                  <span class="dt-student-row-copy"><strong>${a.nome}</strong><small>${a.numero_interno ? `N.º ${a.numero_interno}` : "Número por preencher"}</small></span>
                  <span class="dt-class-arrow" aria-hidden="true">›</span>
                </a>`;
                },
              )
              .join("");
          }

          renderAlunos(alunos);

          document.getElementById("searchAluno").addEventListener("input", (e) => {
            const q = e.target.value.trim().toLowerCase();
            renderAlunos(alunos.filter((a) => `${a.nome || ""} ${a.numero_interno || ""}`.toLowerCase().includes(q)));
          });

          const docsListEl = document.getElementById("docsList");

          function renderDocs(docs) {
            docsListEl.innerHTML = docs.length
              ? docs
                  .map(
                    (d) => `
                    <div class="admin-list-item" data-id="${d.id}" data-path="${d.ficheiro_path}">
                      <div>
                        <strong>${d.titulo}</strong>
                        <span style="color: var(--text-muted); font-size: 12px; display: block">
                          ${[d.categoria, formatDate(d.criado_em)].filter(Boolean).join(" · ")}
                        </span>
                      </div>
                      <div style="display: flex; align-items: center; gap: 8px">
                        <button class="btn btn-secondary ver-doc-btn">Ver</button>
                        <button class="icon-btn danger apagar-doc-btn" title="Apagar documento">✕</button>
                      </div>
                    </div>`,
                  )
                  .join("")
              : '<div class="admin-list-item" style="color: var(--text-muted)">Sem documentos.</div>';
          }

          async function carregarDocs() {
            const docs = await DocumentosService.getByTurma(turmaId);
            renderDocs(docs);
          }

          await carregarDocs();

          const docFormEl = document.getElementById("docForm");
          const docMsgEl = document.getElementById("docMsg");

          document.getElementById("toggleDocFormBtn").addEventListener("click", () => {
            docFormEl.style.display = docFormEl.style.display === "none" ? "block" : "none";
          });

          document.getElementById("cancelarDocBtn").addEventListener("click", () => {
            docFormEl.style.display = "none";
          });

          document.getElementById("guardarDocBtn").addEventListener("click", async () => {
            const titulo = document.getElementById("docTitulo").value.trim();
            const ficheiro = document.getElementById("docFicheiro").files[0];
            if (!titulo || !ficheiro) {
              docMsgEl.innerHTML = '<div class="alert alert-error">Título e ficheiro são obrigatórios.</div>';
              return;
            }
            try {
              const nomeFicheiro = ficheiro.name.replace(/\s+/g, "_");
              const path = `turmas/${turmaId}/${Date.now()}-${nomeFicheiro}`;
              await DocumentosService.upload(ficheiro, path);
              await DocumentosService.create({
                titulo,
                categoria: document.getElementById("docCategoria").value.trim() || null,
                ficheiro_path: path,
                turma_id: turmaId,
                criado_por: professor?.id || null,
              });
              document.getElementById("docTitulo").value = "";
              document.getElementById("docCategoria").value = "";
              document.getElementById("docFicheiro").value = "";
              docMsgEl.innerHTML = "";
              docFormEl.style.display = "none";
              await carregarDocs();
            } catch (err) {
              console.error(err);
              docMsgEl.innerHTML = '<div class="alert alert-error">Erro ao carregar documento.</div>';
            }
          });

          docsListEl.addEventListener("click", async (event) => {
            const item = event.target.closest(".admin-list-item[data-id]");
            if (!item) return;
            const { id, path } = item.dataset;

            if (event.target.closest(".ver-doc-btn")) {
              try {
                const url = await DocumentosService.getSignedUrl(path);
                window.open(url, "_blank");
              } catch (err) {
                console.error(err);
                alert("Erro ao abrir documento.");
              }
            } else if (event.target.closest(".apagar-doc-btn")) {
              if (!confirm("Apagar este documento?")) return;
              await DocumentosService.delete(id, path);
              await carregarDocs();
            }
          });

          loadingEl.style.display = "none";
          document.getElementById("turmaContent").style.display = "block";
        } catch (e) {
          console.error(e);
          loadingEl.textContent = "Erro ao carregar turma.";
        }
      })();

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("service-worker.js").catch(console.error);
      }
    </script>
  </body>
</html>
