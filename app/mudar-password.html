<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mudar palavra-passe — Direção de Turma</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="js/core/config.js"></script>
    <script src="js/core/session.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/pwa-install.js"></script>
  </head>
  <body>
    <main class="login-container">
      <div class="login-card">
        <div class="login-header">
          <img src="assets/logo.png" alt="Logo" class="login-logo" />
          <h2>MUDAR PALAVRA-PASSE</h2>
          <p>Comunidade CSJ Ramalhão</p>
        </div>

        <p id="introMsg" style="color: var(--text-muted); font-size: 13px; margin: 0 0 20px">
          É a primeira vez que entras (ou a tua palavra-passe ainda é a de omissão da escola). Por segurança, define
          agora uma palavra-passe só tua — vais precisar dela para entrares da próxima vez.
        </p>

        <form id="changeForm">
          <div class="form-group">
            <label for="novaPassword">Nova palavra-passe</label>
            <div class="input-with-icon">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  d="M12 17a2 2 0 100-4 2 2 0 000 4zm6-7h-1V7a5 5 0 00-10 0v3H6a2 2 0 00-2 2v7a2 2 0 002 2h12a2 2 0 002-2v-7a2 2 0 00-2-2zM8 7a4 4 0 018 0v3H8V7z"
                />
              </svg>
              <input type="password" id="novaPassword" required minlength="8" class="form-control" placeholder="••••••••" autofocus />
              <button type="button" id="toggleNovaPasswordBtn" class="input-action" aria-label="Mostrar palavra-passe">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 110-10 5 5 0 010 10z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmarPassword">Confirmar nova palavra-passe</label>
            <div class="input-with-icon">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  d="M12 17a2 2 0 100-4 2 2 0 000 4zm6-7h-1V7a5 5 0 00-10 0v3H6a2 2 0 00-2 2v7a2 2 0 002 2h12a2 2 0 002-2v-7a2 2 0 00-2-2zM8 7a4 4 0 018 0v3H8V7z"
                />
              </svg>
              <input type="password" id="confirmarPassword" required minlength="8" class="form-control" placeholder="••••••••" />
              <button type="button" id="toggleConfirmarPasswordBtn" class="input-action" aria-label="Mostrar palavra-passe">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 110-10 5 5 0 010 10z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div id="msg" style="margin-top: 16px"></div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 24px">Guardar e continuar</button>
        </form>

        <div style="margin-top: 16px">
          <button id="signOutBtn" class="btn btn-secondary" style="width: 100%">Sair</button>
        </div>
      </div>
    </main>

    <script>
      (async () => {
        const session = await requireSession("login.html");
        if (!session) return;

        const professor = await getCurrentProfessor();
        if (!professor) {
          document.getElementById("introMsg").textContent = "Não foi possível identificar o professor.";
          return;
        }

        // Navegação direta a esta página depois de já ter mudado a password
        // (ex: "retroceder" no browser) — nada a fazer, segue para a app.
        if (!professor.deve_mudar_password) {
          window.location.href = "index.html";
          return;
        }

        document.getElementById("signOutBtn").addEventListener("click", signOut);

        // Mostrar/ocultar password — mesmo padrão do Scriptorium/login.html,
        // um botão por campo (reutiliza os mesmos SVGs nos dois).
        const EYE_SVG =
          '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 110-10 5 5 0 010 10z"/><circle cx="12" cy="12" r="3"/></svg>';
        const EYE_OFF_SVG =
          '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 4.27L3.28 3 21 20.72 19.73 22 17.72 19.99C15.5 21.07 13.78 21.5 12 21.5 7 21.5 2.73 18.39 1 14c.66-1.52 1.6-2.91 2.73-4.03L2 4.27z"/></svg>';
        function wireTogglePassword(buttonId, inputId) {
          const btn = document.getElementById(buttonId);
          const input = document.getElementById(inputId);
          btn.addEventListener("click", () => {
            if (input.type === "password") {
              input.type = "text";
              btn.innerHTML = EYE_OFF_SVG;
              btn.setAttribute("aria-label", "Ocultar palavra-passe");
            } else {
              input.type = "password";
              btn.innerHTML = EYE_SVG;
              btn.setAttribute("aria-label", "Mostrar palavra-passe");
            }
          });
        }
        wireTogglePassword("toggleNovaPasswordBtn", "novaPassword");
        wireTogglePassword("toggleConfirmarPasswordBtn", "confirmarPassword");

        const form = document.getElementById("changeForm");
        const msg = document.getElementById("msg");

        function showMessage(text, isError = true) {
          msg.innerHTML = text ? `<div class="alert ${isError ? "alert-error" : "alert-success"}">${text}</div>` : "";
        }

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          showMessage("");

          const novaPassword = document.getElementById("novaPassword").value;
          const confirmarPassword = document.getElementById("confirmarPassword").value;

          if (novaPassword !== confirmarPassword) {
            showMessage("As duas palavras-passe não coincidem.");
            return;
          }
          if (novaPassword.length < 8) {
            showMessage("A palavra-passe tem de ter pelo menos 8 caracteres.");
            return;
          }
          if (novaPassword.toLowerCase() === SCHOOL_SHARED_PASSWORD.toLowerCase()) {
            showMessage("Escolhe uma palavra-passe diferente da palavra-passe comum da escola.");
            return;
          }

          const submitBtn = form.querySelector("button[type=submit]");
          submitBtn.disabled = true;
          submitBtn.textContent = "A guardar…";

          const { error: updateError } = await window.supabase.auth.updateUser({ password: novaPassword });
          if (updateError) {
            showMessage("Erro: " + updateError.message);
            submitBtn.disabled = false;
            submitBtn.textContent = "Guardar e continuar";
            return;
          }

          // RPC estreita (não um UPDATE direto): só limpa a flag da PRÓPRIA
          // linha, nunca outros campos — ver db/add_deve_mudar_password.sql.
          const { error: flagError } = await window.supabase.rpc("marcar_password_mudada");
          if (flagError) {
            console.error("Falha ao limpar deve_mudar_password (ignorado)", flagError);
          }

          window.location.href = "index.html";
        });
      })();
    </script>

    <footer style="padding: 14px 0; text-align: center; color: var(--text-muted); font-size: 12px">
      made by antonio.appleton | Departamento de Programação
    </footer>
  </body>
</html>
